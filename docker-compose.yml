services:
  db:
    image: postgres:16-alpine
    container_name: pc-parts-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pc_parts
      POSTGRES_PASSWORD: pc_parts
      POSTGRES_DB: pc_parts
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pc_parts -d pc_parts"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
