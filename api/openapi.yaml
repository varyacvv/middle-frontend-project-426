openapi: 3.0.0
info:
  title: PC Parts Shop API
  version: 0.0.0
tags: []
paths:
  /api/auth/login:
    post:
      operationId: login
      description: Sign in an existing user and start a session
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/User'
                  - $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/auth/logout:
    post:
      operationId: logout
      description: Sign out the current user and end the session
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
  /api/auth/me:
    get:
      operationId: me
      description: Get the currently authenticated user
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/User'
                  - $ref: '#/components/schemas/ApiError'
  /api/auth/register:
    post:
      operationId: register
      description: Register a new user and start a session
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /api/categories:
    get:
      operationId: listCategories
      description: List all categories.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
  /api/health:
    get:
      operationId: health
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required:
                  - status
  /api/orders:
    post:
      operationId: createOrder
      description: Create a new order from the current cart.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderError'
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
    get:
      operationId: listOrders
      description: List orders of the current user.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
  /api/orders/{id}:
    get:
      operationId: getOrder
      description: Get a single order by id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Order'
                  - $ref: '#/components/schemas/ApiError'
  /api/products:
    get:
      operationId: listProducts
      description: List products with filters and pagination.
      parameters:
        - $ref: '#/components/parameters/ProductListParams.category'
        - $ref: '#/components/parameters/ProductListParams.priceMin'
        - $ref: '#/components/parameters/ProductListParams.priceMax'
        - $ref: '#/components/parameters/ProductListParams.available'
        - $ref: '#/components/parameters/ProductListParams.search'
        - $ref: '#/components/parameters/ProductListParams.page'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ProductList'
                  - $ref: '#/components/schemas/ApiError'
  /api/products/{slug}:
    get:
      operationId: getProduct
      description: Get a single product by slug.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Product'
                  - $ref: '#/components/schemas/ApiError'
  /api/promos:
    get:
      operationId: listPromos
      description: List promo blocks for the home page.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PromoBlock'
components:
  parameters:
    ProductListParams.available:
      name: available
      in: query
      required: false
      description: Only products in stock.
      schema:
        type: boolean
      explode: false
    ProductListParams.category:
      name: category
      in: query
      required: false
      description: Category slug. Empty means all categories.
      schema:
        type: string
      explode: false
    ProductListParams.page:
      name: page
      in: query
      required: false
      description: Page number, 1-based.
      schema:
        type: integer
        format: int32
      explode: false
    ProductListParams.priceMax:
      name: priceMax
      in: query
      required: false
      description: Maximum price in whole rubles.
      schema:
        type: integer
        format: int32
      explode: false
    ProductListParams.priceMin:
      name: priceMin
      in: query
      required: false
      description: Minimum price in whole rubles.
      schema:
        type: integer
        format: int32
      explode: false
    ProductListParams.search:
      name: search
      in: query
      required: false
      description: Search by product name.
      schema:
        type: string
      explode: false
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
      description: Common API error format shared by all endpoints
    Category:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: integer
          format: int32
        slug:
          type: string
        name:
          type: string
      description: Product category.
    CreateOrderRequest:
      type: object
      required:
        - method
        - name
        - phone
        - items
      properties:
        method:
          type: string
          enum:
            - delivery
            - pickup
        name:
          type: string
        phone:
          type: string
        address:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemInput'
      description: Payload for order creation. Contains no prices.
    DeliveryMethod:
      type: string
      enum:
        - delivery
        - pickup
      description: Delivery or pickup.
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
      description: Payload for user sign-in.
    Money:
      type: object
      required:
        - amount
      properties:
        amount:
          type: integer
          format: int32
      description: Money amount in rubles
    Order:
      type: object
      required:
        - id
        - status
        - createdAt
        - method
        - name
        - phone
        - address
        - total
        - items
      properties:
        id:
          type: integer
          format: int32
        status:
          type: string
        createdAt:
          type: string
        method:
          type: string
        name:
          type: string
        phone:
          type: string
        address:
          type: string
          nullable: true
        total:
          $ref: '#/components/schemas/Money'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
      description: A completed order.
    OrderError:
      type: object
      required:
        - unavailable
      properties:
        unavailable:
          type: array
          items:
            $ref: '#/components/schemas/OrderErrorItem'
      allOf:
        - $ref: '#/components/schemas/ApiError'
      description: Order was rejected because some products are unavailable.
    OrderErrorItem:
      type: object
      required:
        - slug
        - reason
      properties:
        slug:
          type: string
        reason:
          type: string
      description: Problematic item that blocked an order.
    OrderItem:
      type: object
      required:
        - productId
        - name
        - price
        - quantity
      properties:
        productId:
          type: integer
          format: int32
        name:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        quantity:
          type: integer
          format: int32
      description: Snapshot of a product inside an order.
    OrderItemInput:
      type: object
      required:
        - slug
        - quantity
      properties:
        slug:
          type: string
        quantity:
          type: integer
          format: int32
      description: Single item of a create order request.
    OrderStatus:
      type: string
      enum:
        - paid
      description: Order status.
    Product:
      type: object
      required:
        - id
        - slug
        - name
        - description
        - price
        - inStock
        - imageUrl
        - category
      properties:
        id:
          type: integer
          format: int32
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        inStock:
          type: boolean
        imageUrl:
          type: string
          nullable: true
        category:
          $ref: '#/components/schemas/Category'
      description: Product in the catalog.
    ProductList:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        total:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
      description: Paginated list of products.
    PromoBlock:
      type: object
      required:
        - id
        - title
        - text
        - product
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
        text:
          type: string
        product:
          $ref: '#/components/schemas/Product'
      description: Promo block shown on the home page. Links to a single product.
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
      description: Payload for user registration.
    User:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: integer
          format: int32
        email:
          type: string
      description: User account.
